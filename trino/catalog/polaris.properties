# Trino Iceberg catalog over the Polaris REST catalog (full profile, SPEC R009).
# Mounted read-only at /etc/trino/catalog/polaris.properties by the `trino`
# service in compose.yaml. Fill every ${...} placeholder from `.env` (see
# .env.example) before the first `--profile full` up; hosts running only the
# minimal profile never need this file.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${POLARIS_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.realm=POLARIS
iceberg.rest-catalog.vended-credentials-enabled=true
hive.s3.endpoint=http://rustfs:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=${RUSTFS_ACCESS_KEY}
hive.s3.aws-secret-key=${RUSTFS_SECRET_KEY}
